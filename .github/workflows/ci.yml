name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest -q
      - name: Run reproducible offline evaluations
        run: |
          mkdir -p evaluation-artifacts
          pipeline-rca-benchmark --output evaluation-artifacts/diagnostic-benchmark.json
          pipeline-rca-evaluate-retrieval --output evaluation-artifacts/retrieval-benchmark.json
          pipeline-rca-evaluate-investigation --output evaluation-artifacts/investigation-benchmark.json

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: evaluation-artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build optional API container
        run: docker build --tag pipeline-rca-api:ci .
