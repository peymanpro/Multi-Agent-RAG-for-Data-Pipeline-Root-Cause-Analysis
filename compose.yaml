services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pipeline-rca-api:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RCA_RUNBOOKS_DIR: /app/data/runbooks
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
