services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pipeline-rca-api:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RCA_RUNBOOKS_DIR: /app/data/runbooks
      RCA_API_AUTH_TOKEN: ${RCA_API_AUTH_TOKEN:-}
      RCA_API_USERS_JSON: ${RCA_API_USERS_JSON:-}
      RCA_DEPLOYMENT_MODE: ${RCA_DEPLOYMENT_MODE:-development}
      RCA_RATE_LIMIT_REDIS_URL: ${RCA_RATE_LIMIT_REDIS_URL:-}
      RCA_RATE_LIMIT_REQUESTS: ${RCA_RATE_LIMIT_REQUESTS:-30}
      RCA_RATE_LIMIT_WINDOW_SECONDS: ${RCA_RATE_LIMIT_WINDOW_SECONDS:-60}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
